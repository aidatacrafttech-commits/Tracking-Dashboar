[project]
name = "api-cost-monitor"
version = "0.1.0"
description = "Single-owner dashboard backend for AI API credits and AWS cost monitoring"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are pinned in requirements.txt; dev tooling in requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "DTZ"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
