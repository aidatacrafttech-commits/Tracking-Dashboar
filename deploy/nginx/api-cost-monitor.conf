# API Cost Monitor — nginx site for PUBLIC mode only (skip it for SSH-tunnel access).
#
# A new, separate site for its own hostname. It does not change any existing server block.
# Replace monitor.example.com (4 places) with your monitoring hostname, then:
#   Ubuntu/Debian: sudo install -m 0644 api-cost-monitor.conf /etc/nginx/sites-available/
#                  sudo ln -s ../sites-available/api-cost-monitor.conf /etc/nginx/sites-enabled/
#   Amazon Linux:  sudo install -m 0644 api-cost-monitor.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx      (reload, never restart)
# Certificate (before enabling the 443 block):
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d monitor.example.com

# Sign-in throttling in front of the app's own limits (per client address).
limit_req_zone $binary_remote_addr zone=acm_login:1m rate=10r/m;
# App heartbeats ("Online now"): many phones can share one mobile-network address.
limit_req_zone $binary_remote_addr zone=acm_presence:5m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;

    # ACME HTTP-01 challenges for certbot --webroot; everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` works on nginx 1.18-1.26 (1.25.1+ also accepts `http2 on;`).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:acm_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Optional: restrict to known addresses (home/office IPs) in addition to sign-in.
    # allow 203.0.113.10;
    # deny  all;

    client_max_body_size 64k;
    access_log /var/log/nginx/api-cost-monitor.access.log;
    error_log  /var/log/nginx/api-cost-monitor.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    location = /api/v1/auth/login {
        limit_req zone=acm_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
    }

    # Heartbeats from the AdhyaapakAI mobile app (every 30 s per open app). Reachable from
    # any address even when the allow/deny list above is used; the app's login token is
    # checked by the dashboard. Not access-logged (volume).
    location = /api/v1/integrations/presence/heartbeat {
        allow all;
        limit_req zone=acm_presence burst=200 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:8100;
    }

    # Live updates (Server-Sent Events): no buffering, long reads.
    location = /api/v1/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_pass http://127.0.0.1:8100;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
    }
}
