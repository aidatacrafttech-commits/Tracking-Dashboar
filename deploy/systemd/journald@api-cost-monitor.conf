# Bounded logs for the API Cost Monitor only (journal namespace "api-cost-monitor").
# Leaves the system journal and the main application's logs untouched.
# Install: sudo install -m 0644 journald@api-cost-monitor.conf /etc/systemd/
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=200M
SystemKeepFree=1G
SystemMaxFileSize=20M
MaxRetentionSec=30day
RateLimitIntervalSec=30s
RateLimitBurst=2000
